[package]
name = "dtoolkit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.5.0", features = ["derive"] }
libfuzzer-sys = "0.4"

[dependencies.dtoolkit]
path = ".."

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fdt_mut"
path = "fuzz_targets/fdt_mut.rs"
test = false
doc = false
bench = false
